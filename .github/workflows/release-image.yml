# Builds the Docker image and publishes it to GitHub's container registry
# (ghcr.io/kirtangl/simple-budget) whenever a release is published, so each
# copy can update itself from Settings → Updates.
#
# Tags: the version (0.7.0, 0.7), "beta" for every release including
# pre-releases, and "latest" for full releases only.
#
# The tests run first, and nothing is published unless they all pass.
#
# A release published with no notes gets its version's section of
# CHANGELOG.md as its notes. Notes typed in by hand are left alone.
#
# Every action is pinned to an exact commit (Dependabot proposes updates), and
# only the job that publishes the image can write to the registry. That job
# runs in the "release" environment, so Settings → Environments on GitHub can
# require a click to approve it. A release runs this file as it is on the
# release's branch, so check a branch's .github folder before releasing from it.
name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kirtangl/simple-budget

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13', '22.x'] # the oldest Node the app supports, and the newest 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The app reports the release's own version (0.8.0-beta.1), not package.json's.
          build-args: APP_VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  notes:
    needs: test
    if: github.event_name == 'release' && !github.event.release.body
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy this version's CHANGELOG section into the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          awk -v v="## ${TAG#v} " -v w="## v${TAG#v} " '
            index($0, v) == 1 || index($0, w) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else echo "No CHANGELOG section for $TAG, so the notes stay empty."; fi
