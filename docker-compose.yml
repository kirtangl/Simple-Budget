services:
  budget:
    # The ready-made image from GitHub (see "Updating" in the README). IMAGE_TAG
    # picks which: "latest" (releases), "beta" (releases and pre-releases), or a
    # version like "0.7.0" to stay on it. `docker compose up -d --build` builds
    # from this folder's code instead, e.g. to try a branch.
    image: ghcr.io/kirtangl/simple-budget:${IMAGE_TAG:-latest}
    build: .
    # Change these two in .env to run a second copy (e.g. a test one) on the same machine.
    container_name: ${CONTAINER_NAME:-simple-budget}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # Your local timezone, so bills flip to "paid" on the right day.
      TZ: ${TZ:-Australia/Brisbane}
      # The main login's starting password, for first setup and resets (see README).
      START_PASSWORD: ${START_PASSWORD:-}
      # The rest can also be set in the app (Settings → Advanced); .env wins.
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      APP_CHANNEL: ${APP_CHANNEL:-}
      UPDATE_REPO: ${UPDATE_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # How the app asks the updater (below) to install a new version.
      UPDATER_URL: http://updater:8080
      # The password between the app and the updater. Set your own in .env before the
      # first start (see README); "simple-budget-updater" is only a fallback, the same
      # on every copy, and Settings -> Updates warns while it's in use.
      UPDATER_TOKEN: ${UPDATER_TOKEN:-simple-budget-updater}
      # So the app only offers versions the updater can install (see image above).
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    labels:
      # Only this copy's updater may update it.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ${CONTAINER_NAME:-simple-budget}
    volumes:
      - budget-data:/app/data

  # Installs a new version when you press "Update now" in Settings → Updates:
  # it pulls the new image and restarts the app on it. Your data stays in the
  # budget-data volume. It only does anything when the app asks, and its port
  # isn't published, so only the app can reach it.
  updater:
    # An exact version (and its digest), since it can restart containers. Dependabot proposes updates.
    image: nickfedor/watchtower:1.23.1@sha256:3175c006eb20112f3a70f7002f82dbf4a4078c97e7033735a4d153668fc3dfb1
    container_name: ${CONTAINER_NAME:-simple-budget}-updater
    restart: unless-stopped
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      # Must match the app's UPDATER_TOKEN above (both come from .env).
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATER_TOKEN:-simple-budget-updater}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${CONTAINER_NAME:-simple-budget}
      WATCHTOWER_CLEANUP: "true"
    labels:
      com.centurylinklabs.watchtower.scope: ${CONTAINER_NAME:-simple-budget}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  budget-data:
